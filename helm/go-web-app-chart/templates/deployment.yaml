apiVersion: apps/v1
kind: Deployment
metadata:
  name: tharun-go-web-app
  labels:
    app: tharun-go-web-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tharun-go-web-app
  template:
    metadata:
      labels:
        app: tharun-go-web-app
    spec:
      containers:
        - name: tharun-go-web-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080