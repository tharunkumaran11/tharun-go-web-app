apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tharun-go-web-app
annotations:
  lb.ingress.kubernetes.io/scheme: internet-facing
  alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tharun-go-web-app
                port:
                  number: 80
